<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule Library</title>
<meta name="description" content="A searchable library of self-contained learning capsules.">
<script>
  // Apply a saved theme choice before the page paints (avoids a flash).
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f3;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #5f5f5a;
    --border: #e1e0da;
    --accent: #1f5fbf;
    --accent-soft: #e7eefa;
    --chip: #efeee9;
    --warn-text: #8a4b00;
    --warn-bg: #fff3df;
    --warn-border: #f0c98a;
    --draft-text: #5b4b8a;
    --draft-bg: #efebfa;
    --bad-text: #a1271f;
    --bad-bg: #fde9e7;
    --focus: #1f5fbf;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141413;
      --surface: #1f1f1d;
      --text: #ecebe6;
      --muted: #a8a7a0;
      --border: #34332f;
      --accent: #8db4f5;
      --accent-soft: #23314a;
      --chip: #2b2a27;
      --warn-text: #f5c27a;
      --warn-bg: #3a2c16;
      --warn-border: #6b4f22;
      --draft-text: #c5b8f2;
      --draft-bg: #2e2843;
      --bad-text: #f3a29a;
      --bad-bg: #44211e;
      --focus: #8db4f5;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141413;
    --surface: #1f1f1d;
    --text: #ecebe6;
    --muted: #a8a7a0;
    --border: #34332f;
    --accent: #8db4f5;
    --accent-soft: #23314a;
    --chip: #2b2a27;
    --warn-text: #f5c27a;
    --warn-bg: #3a2c16;
    --warn-border: #6b4f22;
    --draft-text: #c5b8f2;
    --draft-bg: #2e2843;
    --bad-text: #f3a29a;
    --bad-bg: #44211e;
    --focus: #8db4f5;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 8px; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 1.75rem; line-height: 1.2; letter-spacing: -0.01em; }
  .subtitle { margin: 4px 0 0; color: var(--muted); }

  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    padding: 16px 0; margin-top: 8px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.grow { flex: 1 1 260px; }
  .field label { font-size: .8125rem; font-weight: 600; color: var(--muted); }
  input[type="search"], select {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; min-height: 42px; width: 100%;
  }
  select { min-width: 180px; }
  .check {
    display: inline-flex; align-items: center; gap: 8px; min-height: 42px;
    font-size: .9375rem; cursor: pointer; user-select: none;
  }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  button.theme {
    font: inherit; font-size: .875rem; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; cursor: pointer;
    white-space: nowrap;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .status { color: var(--muted); font-size: .9375rem; margin: 0 0 12px; }

  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    padding-bottom: 48px;
  }
  .card {
    position: relative;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 18px; box-shadow: var(--shadow);
    overflow-wrap: anywhere;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-within { border-color: var(--accent); }
  .topic {
    align-self: flex-start;
    font-size: .75rem; font-weight: 600; letter-spacing: .03em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px;
  }
  .card h2 { margin: 0; font-size: 1.125rem; line-height: 1.35; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a::after { content: ""; position: absolute; inset: 0; border-radius: 12px; } /* whole card clickable */
  .card h2 a:hover { text-decoration: underline; }
  .summary { margin: 0; color: var(--muted); font-size: .9375rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tags li { font-size: .8125rem; background: var(--chip); border-radius: 999px; padding: 2px 10px; }
  .dates {
    margin: auto 0 0; padding-top: 10px; border-top: 1px solid var(--border);
    display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .8125rem;
  }
  .dates dt { color: var(--muted); }
  .dates dd { margin: 0; font-variant-numeric: tabular-nums; }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .flag {
    font-size: .8125rem; font-weight: 600; border-radius: 6px; padding: 3px 8px;
    border: 1px solid transparent;
  }
  .flag.stale { color: var(--warn-text); background: var(--warn-bg); border-color: var(--warn-border); }
  .flag.draft { color: var(--draft-text); background: var(--draft-bg); }
  .flag.missing { color: var(--bad-text); background: var(--bad-bg); }

  .empty {
    grid-column: 1 / -1; text-align: center; color: var(--muted);
    padding: 48px 16px; border: 1px dashed var(--border); border-radius: 12px;
  }
  .empty code { background: var(--chip); padding: 1px 6px; border-radius: 4px; }

  @media (max-width: 560px) {
    header { padding-top: 20px; }
    h1 { font-size: 1.5rem; }
    .controls > .field, .controls > .check { flex: 1 1 100%; }
    select { min-width: 0; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title-row">
        <h1>Capsule Library</h1>
        <button type="button" class="theme" id="theme" aria-label="Change colour theme">Theme: Auto</button>
      </div>
      <p class="subtitle">Self-contained learning pages. Click a card to open it.</p>
    </header>

    <div class="controls" role="search">
      <div class="field grow">
        <label for="q">Search</label>
        <input type="search" id="q" placeholder="Title, topic, tag or summary" autocomplete="off">
      </div>
      <div class="field">
        <label for="topic">Topic</label>
        <select id="topic"><option value="">All topics</option></select>
      </div>
      <label class="check"><input type="checkbox" id="drafts"> Show drafts</label>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
    <main class="grid" id="grid"></main>
  </div>

  <!-- Data: generated by update.py from capsules.json -->
  <script src="capsules-data.js"></script>
  <script>
  (function () {
    "use strict";

    var STALE_MONTHS = 6;
    var $ = function (id) { return document.getElementById(id); };
    var grid = $("grid"), statusEl = $("status"), q = $("q"), topicSel = $("topic"), drafts = $("drafts");

    /* ---------- theme toggle: Auto -> Light -> Dark ---------- */
    var themeBtn = $("theme");
    function currentTheme() { return document.documentElement.getAttribute("data-theme") || "auto"; }
    function showTheme() {
      var t = currentTheme();
      themeBtn.textContent = "Theme: " + t.charAt(0).toUpperCase() + t.slice(1);
    }
    themeBtn.addEventListener("click", function () {
      var next = { auto: "light", light: "dark", dark: "auto" }[currentTheme()];
      if (next === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", next);
      try { if (next === "auto") localStorage.removeItem("theme"); else localStorage.setItem("theme", next); } catch (e) {}
      showTheme();
    });
    showTheme();

    /* ---------- helpers ---------- */
    function isTodo(v) { return v == null || String(v).trim() === "" || String(v).trim().toUpperCase() === "TODO"; }
    function parseDate(s) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || "").trim());
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    }
    function fmtDate(s) {
      var d = parseDate(s);
      if (!d) return isTodo(s) ? "not set" : String(s);
      return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
    }
    function isStale(s) {
      var d = parseDate(s);
      if (!d) return true;  // no valid date counts as "needs checking"
      var limit = new Date();
      limit.setHours(0, 0, 0, 0);
      limit.setMonth(limit.getMonth() - STALE_MONTHS);
      return d < limit;
    }
    function norm(s) {
      return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    }
    function safeHref(file) {
      var f = String(file || "");
      if (/^[a-z][a-z0-9+.-]*:/i.test(f) || f.indexOf("//") === 0) return "#";   // only local files
      return f.split("/").map(encodeURIComponent).join("/");
    }
    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    /* ---------- render ---------- */
    function render(items) {
      // topics
      var topics = {};
      items.forEach(function (c) { if (!isTodo(c.topic)) topics[c.topic] = true; });
      Object.keys(topics).sort(function (a, b) { return a.localeCompare(b); }).forEach(function (t) {
        topicSel.appendChild(new Option(t, t));
      });

      // newest first, then by title
      items.sort(function (a, b) {
        var da = parseDate(a.date_built), db = parseDate(b.date_built);
        if (da && db && da - db !== 0) return db - da;
        if (!!da !== !!db) return da ? -1 : 1;
        return String(a.title || "").localeCompare(String(b.title || ""));
      });

      var cards = items.map(function (c) {
        var card = el("article", "card");
        var tags = Array.isArray(c.tags) ? c.tags.filter(function (t) { return !isTodo(t); }) : [];

        if (!isTodo(c.topic)) card.appendChild(el("span", "topic", c.topic));

        var h = el("h2");
        var a = el("a", null, isTodo(c.title) ? (c.file || "Untitled") : c.title);
        a.href = safeHref(c.file);
        h.appendChild(a);
        card.appendChild(h);

        if (!isTodo(c.summary)) card.appendChild(el("p", "summary", c.summary));

        if (tags.length) {
          var ul = el("ul", "tags");
          ul.setAttribute("aria-label", "Tags");
          tags.forEach(function (t) { ul.appendChild(el("li", null, t)); });
          card.appendChild(ul);
        }

        var flags = el("div", "flags");
        if (c.status === "draft") flags.appendChild(el("span", "flag draft", "Draft"));
        if (isStale(c.facts_verified_as_of)) {
          var f = el("span", "flag stale", "⚠ Re-check facts");
          f.title = parseDate(c.facts_verified_as_of)
            ? "Facts were last verified more than " + STALE_MONTHS + " months ago."
            : "No 'verified as of' date set yet.";
          flags.appendChild(f);
        }
        if (c._missing) flags.appendChild(el("span", "flag missing", "File not found"));
        if (flags.children.length) card.appendChild(flags);

        var dl = el("dl", "dates");
        dl.appendChild(el("dt", null, "Built"));
        dl.appendChild(el("dd", null, fmtDate(c.date_built)));
        dl.appendChild(el("dt", null, "Facts verified"));
        dl.appendChild(el("dd", null, fmtDate(c.facts_verified_as_of)));
        card.appendChild(dl);

        var haystack = norm([c.title, c.topic, tags.join(" "), c.summary].join(" "));
        return { node: card, data: c, text: haystack };
      });

      function apply() {
        var words = norm(q.value).split(/\s+/).filter(Boolean);
        var topic = topicSel.value, showDrafts = drafts.checked;
        var shown = 0, hiddenDrafts = 0;
        grid.textContent = "";
        cards.forEach(function (c) {
          if (topic && c.data.topic !== topic) return;
          if (!words.every(function (w) { return c.text.indexOf(w) !== -1; })) return;
          if (c.data.status === "draft" && !showDrafts) { hiddenDrafts++; return; }
          grid.appendChild(c.node);
          shown++;
        });
        var msg = shown + (shown === 1 ? " capsule" : " capsules");
        if (hiddenDrafts) msg += " · " + hiddenDrafts + (hiddenDrafts === 1 ? " draft" : " drafts") + " hidden";
        statusEl.textContent = msg;
        if (!shown) {
          var empty = el("div", "empty");
          empty.textContent = items.length ? "No capsules match your filters." : "No capsules yet.";
          grid.appendChild(empty);
        }
      }

      [q, topicSel].forEach(function (n) { n.addEventListener("input", apply); });
      drafts.addEventListener("change", apply);
      apply();
    }

    function showError() {
      statusEl.textContent = "";
      var box = el("div", "empty");
      box.appendChild(document.createTextNode("No data found. Run "));
      box.appendChild(el("code", null, "python3 update.py"));
      box.appendChild(document.createTextNode(" in this folder, then reload the page."));
      grid.appendChild(box);
    }

    if (Array.isArray(window.CAPSULES)) {
      render(window.CAPSULES.slice());
    } else if (location.protocol.indexOf("http") === 0) {
      // Fallback when served from a web server: read capsules.json directly.
      fetch("capsules.json").then(function (r) { return r.json(); })
        .then(function (d) { Array.isArray(d) ? render(d) : showError(); })
        .catch(showError);
    } else {
      showError();
    }
  })();
  </script>
</body>
</html>
